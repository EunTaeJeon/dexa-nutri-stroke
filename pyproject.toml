[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexa-nutri-stroke"
version = "1.0.0"
description = "Prediction of functional outcome after acute ischaemic stroke from body composition and nutritional status"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.3.2",
    "scipy==1.13.1",
    "statsmodels==0.14.4",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "numba==0.60.0",
    "optuna>=3.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
